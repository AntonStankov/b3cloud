name: Deploy B3 infrastructure services

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-api-services:
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: ${{ secrets.B3_API_HOST }}
      REMOTE_USER: ${{ secrets.B3_API_SSH_USER || 'root' }}
      ADMIN_DOMAIN: ${{ secrets.B3_ADMIN_DOMAIN }}
      USER_DOMAIN: ${{ secrets.B3_USER_DOMAIN }}
      LEGACY_USER_DOMAIN: ${{ secrets.B3_LEGACY_USER_DOMAIN }}
      MONITORING_DOMAIN: ${{ secrets.B3_MONITORING_DOMAIN }}
      ADMIN_TOKEN: ${{ secrets.B3_ADMIN_TOKEN }}
      USER_API_KEY: ${{ secrets.B3_USER_API_KEY }}
      CLUSTER_DOMAIN: ${{ secrets.B3_CLUSTER_DOMAIN }}
      GITHUB_PAT: ${{ secrets.B3_GITHUB_PAT }}
      GITHUB_WEBHOOK_SECRET: ${{ secrets.B3_GITHUB_WEBHOOK_SECRET }}
      REGISTRY_SERVER: ${{ secrets.B3_REGISTRY_SERVER }}
      REGISTRY_USERNAME: ${{ secrets.B3_REGISTRY_USERNAME }}
      REGISTRY_NAMESPACE: ${{ secrets.B3_REGISTRY_NAMESPACE }}
      REGISTRY_PASSWORD: ${{ secrets.B3_REGISTRY_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.B3_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.B3_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.B3_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            REMOTE_HOST ADMIN_DOMAIN USER_DOMAIN MONITORING_DOMAIN
            ADMIN_TOKEN USER_API_KEY CLUSTER_DOMAIN GITHUB_PAT
            REGISTRY_SERVER REGISTRY_USERNAME REGISTRY_NAMESPACE REGISTRY_PASSWORD
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ZONE_ID CLOUDFLARE_TUNNEL_ID CF_ACCOUNT_ID
            SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret/env: $name" >&2
              exit 1
            fi
          done

      - name: Build client frontend
        shell: bash
        working-directory: Client
        env:
          VITE_API_BASE_URL: ""
          VITE_USE_MOCKS: "false"
          VITE_SUPABASE_URL: ${{ secrets.B3_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.B3_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.B3_API_SSH_PRIVATE_KEY }}" > ~/.ssh/b3_api_key
          chmod 600 ~/.ssh/b3_api_key
          ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts

      - name: Package B3 service code
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/b3cloud-services.tgz \
            admin_api.py \
            user_api.py \
            platform_core.py \
            README.md \
            scripts \
            supabase \
            templates \
            admin_ui \
            user_ui \
            Client/dist \
            infrastructure.tf \
            kpack-configuration.yaml

      - name: Deploy API VM runtime and services
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/b3_api_key /tmp/b3cloud-services.tgz "$REMOTE_USER@$REMOTE_HOST:/root/b3cloud-services.tgz"
          ssh -i ~/.ssh/b3_api_key "$REMOTE_USER@$REMOTE_HOST" \
            ADMIN_DOMAIN="$ADMIN_DOMAIN" \
            USER_DOMAIN="$USER_DOMAIN" \
            LEGACY_USER_DOMAIN="${LEGACY_USER_DOMAIN:-}" \
            ADMIN_TOKEN="$ADMIN_TOKEN" \
            USER_API_KEY="$USER_API_KEY" \
            CLUSTER_DOMAIN="$CLUSTER_DOMAIN" \
            GITHUB_PAT="$GITHUB_PAT" \
            GITHUB_WEBHOOK_SECRET="$GITHUB_WEBHOOK_SECRET" \
            REGISTRY_SERVER="$REGISTRY_SERVER" \
            REGISTRY_USERNAME="$REGISTRY_USERNAME" \
            REGISTRY_NAMESPACE="$REGISTRY_NAMESPACE" \
            REGISTRY_PASSWORD="$REGISTRY_PASSWORD" \
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" \
            CLOUDFLARE_ZONE_ID="$CLOUDFLARE_ZONE_ID" \
            CLOUDFLARE_TUNNEL_ID="$CLOUDFLARE_TUNNEL_ID" \
            CF_ACCOUNT_ID="$CF_ACCOUNT_ID" \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          mkdir -p /opt/b3cloud
          tar -xzf /root/b3cloud-services.tgz -C /opt/b3cloud
          bash /opt/b3cloud/scripts/install_b3_api_runtime.sh
          REMOTE

      - name: Sync Cloudflare public routes
        shell: bash
        env:
          ADMIN_ORIGIN: http://${{ secrets.B3_API_HOST }}
          USER_ORIGIN: http://${{ secrets.B3_API_HOST }}
        run: |
          set -euo pipefail
          if [[ -z "${LEGACY_USER_DOMAIN:-}" ]]; then
            LEGACY_USER_DOMAIN="old-${USER_DOMAIN%%.*}.${USER_DOMAIN#*.}"
          fi
          export LEGACY_USER_DOMAIN
          python scripts/sync_cloudflare_routes.py

      - name: Verify public endpoints
        shell: bash
        run: |
          set -euo pipefail
          legacy_domain="${LEGACY_USER_DOMAIN:-}"
          if [[ -z "$legacy_domain" ]]; then
            legacy_domain="old-${USER_DOMAIN%%.*}.${USER_DOMAIN#*.}"
          fi

          retry_curl() {
            local url="$1"
            shift
            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 10 "$@" "$url"; then
                return 0
              fi
              echo "Waiting for endpoint: $url ($attempt/30)"
              sleep 5
            done
            curl -fsS --max-time 10 "$@" "$url"
          }

          retry_curl "https://$USER_DOMAIN/health" | grep -q '"status":"ok"'
          retry_curl "https://$legacy_domain/health" | grep -q '"status":"ok"'
          retry_curl "https://$ADMIN_DOMAIN/health" -H "X-Admin-Token: $ADMIN_TOKEN" | grep -q '"status":"ok"'
