apiVersion: v1
kind: Namespace
metadata:
  name: kpack
---
apiVersion: v1
kind: Secret
metadata:
  name: github-basic-auth
  namespace: kpack
stringData:
  username: git
  password: "<GITHUB_PERSONAL_ACCESS_TOKEN>"
type: kubernetes.io/basic-auth
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-creds
  namespace: kpack
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "<REGISTRY_SERVER>": {
          "username": "<REGISTRY_USERNAME>",
          "password": "<REGISTRY_PASSWORD>",
          "auth": "<BASE64_USER_PASS>"
        }
      }
    }
---
apiVersion: kpack.io/v1alpha2
kind: ClusterStore
metadata:
  name: platform-store
spec:
  sources:
  - image: paketobuildpacks/nodejs:latest
  - image: paketobuildpacks/python:latest
  - image: paketobuildpacks/go:latest
  - image: paketobuildpacks/procfile:latest
  - image: paketobuildpacks/nginx:latest
---
apiVersion: kpack.io/v1alpha2
kind: ClusterStack
metadata:
  name: platform-base-stack
spec:
  id: "io.buildpacks.stacks.jammy"
  buildImage:
    image: paketobuildpacks/build-jammy-base:latest
  runImage:
    image: paketobuildpacks/run-jammy-base:latest
---
apiVersion: kpack.io/v1alpha2
kind: ClusterBuilder
metadata:
  name: platform-builder
spec:
  serviceAccountRef:
    name: kpack-builder-sa
    namespace: kpack
  tag: "<REGISTRY_SERVER>/<REGISTRY_NAMESPACE>/platform-builder:latest"
  stack:
    name: platform-base-stack
    kind: ClusterStack
  store:
    name: platform-store
    kind: ClusterStore
  order:
  - group:
    - id: paketo-buildpacks/nodejs
  - group:
    - id: paketo-buildpacks/python
  - group:
    - id: paketo-buildpacks/go
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kpack-builder-sa
  namespace: kpack
secrets:
- name: github-basic-auth
- name: registry-creds
imagePullSecrets:
- name: registry-creds
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: app-quota
  namespace: default
spec:
  hard:
    pods: "20"
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    services: "20"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: app-limits
  namespace: default
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    default:
      cpu: "500m"
      memory: "512Mi"
    min:
      cpu: "50m"
      memory: "64Mi"
    max:
      cpu: "2"
      memory: "4Gi"
